<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OMP Studio webview harness</title>
<link rel="stylesheet" href="../../dist/webview.css">
<style>
	/* Stand in for the VS Code sidebar: the webview CSS owns everything inside. */
	body { margin: 0; background: var(--vscode-sidebar-background, #252526); }
	#app { width: 380px; height: 100vh; overflow: hidden; }
	/* Harness-only switch; never part of the shipped webview. */
	#scenarios { position: fixed; right: 8px; bottom: 8px; font: 11px sans-serif; opacity: 0.4; }
	#scenarios a { color: #6cf; margin-left: 6px; }
	/* The real host injects the VS Code theme; the harness stands in with Dark+ defaults
	   so the shipped CSS renders legibly outside VS Code. */
	:root {
		--vscode-foreground: #cccccc;
		--vscode-sideBar-background: #252526;
		--vscode-editorWidget-background: #1f1f1f;
		--vscode-panel-border: rgba(127, 127, 127, 0.3);
		--vscode-button-background: #0a66c2;
		--vscode-button-foreground: #ffffff;
		--vscode-descriptionForeground: #999999;
		--vscode-input-background: rgba(127, 127, 127, 0.1);
		--vscode-textCodeBlock-background: rgba(127, 127, 127, 0.12);
		--vscode-list-hoverBackground: rgba(127, 127, 127, 0.12);
		--vscode-focusBorder: #3794ff;
	}
</style>
</head>
<body>
<div id="app"></div>
<div id="scenarios"><a href="?log=main">正常</a><a href="?log=plan">计划视图</a><a href="?log=failure">进程失败</a><a href="?log=palette">空列表面板</a></div>
<script src="./harness-bridge.js"></script>
<script src="../../dist/webview.js"></script>
</body>
</html>
